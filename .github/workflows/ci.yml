name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest tests/unit -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build and start container
        run: docker compose up -d --build

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready"
          exit 1

      - name: Run Postman collection
        run: |
          npx --yes newman@6.2.1 run \
            tests/postman/task-api.postman_collection.json \
            --env-var base_url=http://127.0.0.1:8001 \
            --timeout-request 5000 \
            --bail

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail=100

      - name: Stop containers
        if: always()
        run: docker compose down