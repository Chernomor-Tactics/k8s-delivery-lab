name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest tests/unit -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build and start container
        run: docker compose up -d --build

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 3 \
              http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready"
          exit 1

      - name: Run Postman collection
        run: |
          npx --yes newman@6.2.1 run \
            tests/postman/task-api.postman_collection.json \
            --env-var base_url=http://127.0.0.1:8001 \
            --timeout-request 5000 \
            --bail

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail=100

      - name: Stop containers
        if: always()
        run: docker compose down
    publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Prepare image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}